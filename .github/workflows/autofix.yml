name: Autofix

on:
  push:
    branches-ignore:
      - main

jobs:
  autofix:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # We need to fetch the history to be able to push back to the repository
          fetch-depth: 0
          # We need to use a token with write permissions to be able to push back to the repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Autofix
        run: npm run lint:fix

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: autofix linting issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>" 